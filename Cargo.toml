[package]
name = "monet"
version = "0.1.0"
edition = "2024"
description = "A small, fast video player for GNOME"
license = "GPL-3.0-or-later"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_6"] }
gst = { package = "gstreamer", version = "0.25" }
glib-unix = "0.22"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
